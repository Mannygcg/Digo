name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Digo.xcodeproj \
            -scheme Digo \
            -configuration Release \
            -archivePath build/Digo.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}"

      - name: Export app + ad-hoc sign
        run: |
          mkdir -p build/export
          cp -R "build/Digo.xcarchive/Products/Applications/Digo.app" build/export/
          codesign --force --deep --sign - "build/export/Digo.app"

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p build/dmg-source
          cp -R build/export/Digo.app build/dmg-source/
          VERSION="${{ steps.version.outputs.version }}"
          rm -f "build/Digo-$VERSION.dmg"

          # create-dmg drives Finder via AppleScript, which can exit non-zero
          # even when it actually succeeds — check for the real file after.
          create-dmg \
            --volname "Digo" \
            --background "dmg-assets/background.png" \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Digo.app" 180 185 \
            --app-drop-link 480 185 \
            --hide-extension "Digo.app" \
            --no-internet-enable \
            "build/Digo-$VERSION.dmg" \
            "build/dmg-source" || true

          if [ ! -f "build/Digo-$VERSION.dmg" ]; then
            echo "create-dmg didn't produce a file — falling back to a plain hdiutil dmg"
            hdiutil create -volname "Digo" \
              -srcfolder build/export/Digo.app \
              -ov -format UDZO \
              "build/Digo-$VERSION.dmg"
          fi

      - name: Upload artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Digo-dev-build
          path: build/Digo-*.dmg

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Digo-*.dmg
          generate_release_notes: true
          body: |
            Digo isn't notarized (no paid Apple Developer account — this project is free and community-run), so macOS will flag it as from an unidentified developer on first launch. Right-click **Digo.app** and choose **Open** once to confirm, then it launches normally from then on.
